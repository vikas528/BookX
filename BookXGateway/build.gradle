plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.bookxshow'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2023.0.0")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Spring Cloud Gateway (reactive, WebFlux-based)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

    // OAuth2 Client — for Authorization Code flow (login via auth server)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // OAuth2 Resource Server — for validating JWT Bearer tokens on API calls
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Local Development ──────────────────────────────────────────────────────
tasks.register('bootRunLocal') {
    description = 'Runs the Spring Boot application with the local profile'
    group       = 'application'
    doFirst {
        tasks.bootRun.configure {
            systemProperty 'spring.profiles.active', 'local'
        }
    }
    finalizedBy 'bootRun'
}
