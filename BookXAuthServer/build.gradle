plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.bookxshow'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Authorization Server (includes spring-security-oauth2-authorization-server)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Spring Web (servlet-based, required by Authorization Server)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Data JPA + PostgreSQL (user persistence)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Local Development ──────────────────────────────────────────────────────
tasks.register('bootRunLocal') {
    description = 'Runs the Spring Boot application with the local profile'
    group       = 'application'
    doFirst {
        tasks.bootRun.configure {
            systemProperty 'spring.profiles.active', 'local'
        }
    }
    finalizedBy 'bootRun'
}
