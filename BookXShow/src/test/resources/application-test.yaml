# ============================================================================
# BookXShow — Unit Test Configuration
# ============================================================================
# Uses H2 in-memory database for fast unit tests.
# ============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:bookxshow_unit;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable OAuth2 Resource Server JWT in unit tests
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:

bookxshow:
  booking:
    seat-lock-ttl-ms: 2000
    lock-sweep-interval-ms: 60000
  auth:
    token-url: http://localhost:9997/oauth2/token
    client-id: test-client
    client-secret: test-secret
    scope: bookxshow.read bookxshow.write
  admin-service:
    base-url: http://localhost:9999
    shows-uri: /api/v1/shows
    timeout-ms: 10000
  payment:
    gateway-url: http://localhost:9998
    charge-uri: /api/v1/payments/charge
    timeout-ms: 5000
