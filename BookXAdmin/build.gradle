plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.bookxshow'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

// ── Source sets ─────────────────────────────────────────────────────────────
sourceSets {
    integrationTest {
        java {
            srcDirs = ['src/integrationTest/java']
        }
        resources {
            srcDirs = ['src/integrationTest/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath  += output + compileClasspath
    }
}

// ── Configurations ───────────────────────────────────────────────────────────
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom    testRuntimeOnly
}

// ── Dependencies ─────────────────────────────────────────────────────────────
repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Security — OAuth2 Resource Server (JWT validation)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Spring Authorization Server library (for JdbcRegisteredClientRepository)
    // NOTE: library only, NOT the starter — no auth server auto-configuration
    implementation 'org.springframework.security:spring-security-oauth2-authorization-server:1.2.2'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Integration Testing
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestRuntimeOnly 'com.h2database:h2'
}

// ── Test tasks ───────────────────────────────────────────────────────────────
tasks.named('test') {
    useJUnitPlatform()
    description = 'Runs unit tests in src/test'
    group       = 'verification'
    finalizedBy jacocoTestReport
}

tasks.register('integrationTest', Test) {
    description      = 'Runs integration tests in src/integrationTest'
    group            = 'verification'
    testClassesDirs  = sourceSets.integrationTest.output.classesDirs
    classpath        = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter('test')
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

check.dependsOn('integrationTest')

// ── JaCoCo ───────────────────────────────────────────────────────────────────

jacoco {
    toolVersion = '0.8.11'
}

def jacocoExclusions = [
    // Application entry point
    'com/bookxshow/admin/BookXAdminApplication.class',

    // Configuration classes (bean wiring / properties binding)
    'com/bookxshow/admin/config/AppConfig.class',
    'com/bookxshow/admin/config/M2mClientConfig.class',
    'com/bookxshow/admin/config/ResourceServerConfig.class',

    // DTOs — pure data-transfer objects with getters/setters
    'com/bookxshow/admin/dto/**',

    // JPA entities — Lombok-generated getters/setters + JPA lifecycle callbacks
    'com/bookxshow/admin/entity/**',

    // Enums — trivial constant definitions
    'com/bookxshow/admin/enums/**',

    // Simple exception classes (only constructors delegating to super)
    'com/bookxshow/admin/exception/ShowNotFoundException.class',
    'com/bookxshow/admin/exception/ShowAlreadyExistsException.class',
    'com/bookxshow/admin/exception/InvalidShowStateException.class',
    'com/bookxshow/admin/exception/ClientNotFoundException.class',
    'com/bookxshow/admin/exception/ClientAlreadyExistsException.class',
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required  = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: jacocoExclusions)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value   = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value   = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: jacocoExclusions)
        }))
    }
}

check.dependsOn jacocoTestCoverageVerification

// ── Local Development ──────────────────────────────────────────────────────
tasks.register('bootRunLocal') {
    description = 'Runs the Spring Boot application with the local profile'
    group       = 'application'
    doFirst {
        tasks.bootRun.configure {
            systemProperty 'spring.profiles.active', 'local'
        }
    }
    finalizedBy 'bootRun'
}
