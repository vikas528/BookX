# ============================================================================
# BookXAdmin — Integration Test Configuration
# ============================================================================
# Uses H2 in-memory database and short TTLs for integration tests.
# ============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:bookxadmin_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable OAuth2 Resource Server JWT in integration tests
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:

logging:
  level:
    com.bookxshow: DEBUG
