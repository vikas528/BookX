# ============================================================================
# BookXAdmin — Unit Test Configuration
# ============================================================================
# Uses H2 in-memory database for fast unit tests.
# ============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:bookxadmin_unit;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable OAuth2 Resource Server JWT in unit tests
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
